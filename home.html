<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Comic Neue', cursive;
      margin: 0;
      padding: 0;
    }

    nav {
      background-color: black;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 20px;
      background-color: white;
      color: black;
      padding: 6px 14px;
      border-radius: 4px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: lightgray;
    }

    .home {
      background-image: url('BACK.jpg');
      background-size: cover;
      background-position: center;
      height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      border: 2px dotted #ccc;
      margin: 20px;
      border-radius: 10px;
    }

    .home h1 {
      font-size: 32px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 8px 20px;
      border-radius: 8px;
    }

    .home p {
      margin-top: 10px;
      font-size: 16px;
      max-width: 600px;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .collections {
      padding: 20px 40px;
    }

    .collections h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Ghid911</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Collections</a>
      <a href="#">About</a>
    </div>
  </nav>

  <section class="home">
    <h1>Maharaghid Putra Mahendra</h1>
    <p>Selalu ada kemudahan di setiap perjuangan.</p>
  </section>

  <section class="collections">
    <h2>Ghid Dan Hobinya</h2>
    <div class="gallery">
      <div class="card">
        <img src="911.jpg" alt="Gambar 1">
        <p>Ghid911</p>
      </div>
      <div class="card">
        <img src="bl.jpg" alt="Gambar 2">
        <p>Billiard</p>
      </div>
      <div class="card">
        <img src="9111.jpg" alt="Gambar 3">
        <p>Ghid911</p>
      </div>
      <div class="card">
        <img src="gitar.jpg" alt="Gambar 4">
        <p>Guitar</p>
      </div>
    </div>
  </section>

</body>
</html>
